<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard — Sinta</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f7;
            color: #292929;
            padding: 25px;
        }
        
        .container {
            max-width: 1100px;
            margin: auto;
        }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }
        
        h1 {
            font-size: 25px;
            margin-bottom: 6px;
        }
        
        .muted {
            color: #777;
            font-size: 13px;
        }
        
        .card {
            background: white;
            border-radius: 15px;
            padding: 22px;
            margin-bottom: 20px;
            box-shadow: 0 3px 15px #00000008;
        }
        
        .login {
            max-width: 400px;
            margin: 10vh auto;
        }
        
        input {
            width: 100%;
            padding: 13px;
            margin-top: 12px;
            border: 1px solid #ddd;
            border-radius: 9px;
            font-size: 14px;
        }
        
        button {
            padding: 11px 16px;
            border: 0;
            border-radius: 9px;
            background: #292929;
            color: white;
            cursor: pointer;
        }
        
        button:hover {
            opacity: .85;
        }
        
        .primary {
            width: 100%;
            margin-top: 15px;
        }
        
        .logout {
            background: #e9e9e9;
            color: #333;
        }
        
        .stats {
            font-size: 35px;
            font-weight: bold;
            margin-top: 10px;
        }
        
        .wish {
            border: 1px solid #eee;
            border-radius: 12px;
            padding: 18px;
            margin-top: 14px;
        }
        
        .wish-head {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        
        .wish p {
            line-height: 1.7;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            margin: 12px 0;
        }
        
        .signature {
            max-width: 190px;
            max-height: 90px;
            object-fit: contain;
            border: 1px solid #eee;
            border-radius: 8px;
            margin: 10px 0;
        }
        
        .download {
            display: inline-block;
            padding: 10px 14px;
            background: #fce7ef;
            color: #a12b58;
            border-radius: 8px;
            text-decoration: none;
            font-size: 13px;
            margin-top: 8px;
        }
        
        .hidden {
            display: none;
        }
        
        #message {
            color: #b42318;
            margin-top: 12px;
            font-size: 13px;
        }
        
        @media(max-width:600px) {
            body {
                padding: 15px;
            }
            header {
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- LOGIN -->
        <section id="loginPage" class="card login">
            <h1>Admin Dashboard ♡</h1>
            <p class="muted">Masuk untuk melihat harapan Sinta.</p>

            <form id="loginForm">
                <input id="email" type="email" placeholder="Email admin" autocomplete="username" required>

                <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>

                <button class="primary" type="submit">
                Login
            </button>
            </form>

            <div id="message"></div>
        </section>

        <!-- DASHBOARD -->
        <section id="dashboard" class="hidden">

            <header>
                <div>
                    <h1>Dashboard Harapan ♡</h1>
                    <p class="muted">Khusus untuk Ibah Misbah</p>
                </div>

                <button class="logout" id="logoutBtn">
                Logout
            </button>
            </header>

            <div class="card">
                <p class="muted">Total harapan masuk</p>
                <div class="stats" id="total">0</div>
            </div>

            <div class="card">
                <div class="wish-head">
                    <div>
                        <h3>Daftar Harapan</h3>
                        <p class="muted">Harapan terbaru ditampilkan lebih dahulu.</p>
                    </div>

                    <button id="refreshBtn">Refresh</button>
                </div>

                <div id="wishList">
                    Memuat data...
                </div>
            </div>

        </section>

    </div>

    <script>
        // KONFIGURASI SUPABASE
        const SUPABASE_URL =
            'https://jkjlzqfcuncmcrrwjoge.supabase.co';

        const SUPABASE_KEY =
            'sb_publishable_Wte0RyGqpjgs1OyCtxHn8Q_ZUd3AzyE';

        const OWNER_ID =
            '200e152b-943c-469f-9677-6c2a0d0812fc';

        const db = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

        const loginPage = document.getElementById('loginPage');
        const dashboard = document.getElementById('dashboard');
        const message = document.getElementById('message');
        const wishList = document.getElementById('wishList');

        // MENCEGAH HTML DARI INPUT PENGUNJUNG
        function escapeHTML(value) {
            return String(value ?? '').replace(/[&<>"']/g, char => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            })[char]);
        }

        // PERIKSA SESI LOGIN DAN UID PEMILIK
        async function checkSession() {
            const {
                data,
                error
            } = await db.auth.getSession();

            if (error || !data.session) {
                showLogin();
                return;
            }

            if (data.session.user.id !== OWNER_ID) {
                await db.auth.signOut();
                showLogin();
                message.textContent = 'Akun ini tidak memiliki akses admin.';
                return;
            }

            showDashboard();
            loadWishes();
        }

        function showLogin() {
            loginPage.classList.remove('hidden');
            dashboard.classList.add('hidden');
        }

        function showDashboard() {
            loginPage.classList.add('hidden');
            dashboard.classList.remove('hidden');
            message.textContent = '';
        }

        // LOGIN
        document.getElementById('loginForm')
            .addEventListener('submit', async event => {

                event.preventDefault();

                message.textContent = 'Memeriksa akun...';

                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;

                const {
                    data,
                    error
                } = await db.auth.signInWithPassword({
                    email,
                    password
                });

                if (error) {
                    message.textContent = 'Login gagal. Periksa email dan password.';
                    return;
                }

                if (data.user.id !== OWNER_ID) {
                    await db.auth.signOut();
                    message.textContent = 'Akun ini bukan pemilik dashboard.';
                    return;
                }

                showDashboard();
                loadWishes();
            });

        // AMBIL DATA HARAPAN
        async function loadWishes() {
            wishList.textContent = 'Memuat data...';

            const {
                data,
                error
            } = await db
                .from('wishes')
                .select('id, created_at, name, wish, signature, certificate_path')
                .order('created_at', {
                    ascending: false
                });

            if (error) {
                console.error(error);
                wishList.textContent = 'Gagal mengambil data harapan.';
                return;
            }

            document.getElementById('total').textContent = data.length;

            if (!data.length) {
                wishList.textContent = 'Belum ada harapan masuk.';
                return;
            }

            wishList.innerHTML = '';

            for (const item of data) {
                const date = new Date(item.created_at)
                    .toLocaleString('id-ID');

                let certificateLink = '';

                // URL SEMENTARA UNTUK DOWNLOAD SERTIFIKAT
                if (item.certificate_path) {
                    const {
                        data: fileData,
                        error: fileError
                    } =
                    await db.storage
                        .from('certificates')
                        .createSignedUrl(item.certificate_path, 300);

                    if (!fileError && fileData?.signedUrl) {
                        certificateLink = `
                        <a class="download"
                           href="${escapeHTML(fileData.signedUrl)}"
                           target="_blank"
                           rel="noopener">
                           Lihat / Unduh Sertifikat PNG
                        </a>
                    `;
                    }
                }

                const signature = typeof item.signature === 'string' &&
                    item.signature.startsWith('data:image/png;base64,') ?
                    `<img class="signature"
                        src="${item.signature}"
                        alt="Tanda tangan pengirim">` :
                    '<span class="muted">Tidak ada tanda tangan.</span>';

                const card = document.createElement('article');
                card.className = 'wish';

                card.innerHTML = `
                <div class="wish-head">
                    <strong>${escapeHTML(item.name)}</strong>
                    <span class="muted">${escapeHTML(date)}</span>
                </div>

                <p>${escapeHTML(item.wish)}</p>

                <div>
                    <span class="muted">Tanda tangan:</span><br>
                    ${signature}
                </div>

                ${certificateLink}
            `;

                wishList.appendChild(card);
            }
        }

        // REFRESH
        document.getElementById('refreshBtn')
            .addEventListener('click', loadWishes);

        // LOGOUT
        document.getElementById('logoutBtn')
            .addEventListener('click', async() => {
                await db.auth.signOut();
                showLogin();
            });

        // PANTAU PERUBAHAN STATUS LOGIN
        db.auth.onAuthStateChange((event, session) => {
            if (event === 'SIGNED_OUT') {
                showLogin();
            }
        });

        // PERIKSA SAAT HALAMAN DIBUKA
        checkSession();
    </script>

</body>

</html>
